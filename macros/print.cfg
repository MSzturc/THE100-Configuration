# ============================================================
# Print pipeline: PRINT_START + PRINT_END.
#
# Constants below are shared with helpers/nozzle_wipe.cfg.
# Edit here -- single source of truth.
#
# Wipe-Strip: rear-left bed edge -- chosen over front to keep the
#             fan duct clear of tall prints during the Z0.3 descent.
# Soft preheat: 150 C -- filament solid for collision homing.
# Thermal Z offset: nozzle expansion 150 C -> print temperature.
# ============================================================

[constants]
wipe_y: ${constants.print_volume_y} - 5
wipe_x_min: 15
wipe_x_max: 45
wipe_z: 0.2
wipe_count: 4
wipe_speed: 6000
wipe_travel_z: 6
soft_preheat_temp: 150
thermal_z_offset: 0.04


# 5-Phasen-PRINT_START fuer BDsensor Collision-Homing ohne Brush.
# Slicer call: PRINT_START BED=60 EXTRUDER=200 [SOAK=0] [MATERIAL=PLA]
#
# Phase 1: INIT          - state reset, mesh clear
# Phase 2: Soft preheat  - bed to target (incl. soak), hotend to 150 C
# Phase 3: Home + Wipe + Level + Mesh
# Phase 4: Final heat    - park over wipe zone, ramp to print temp
# Phase 5: Final wipe + adaptive prime line
[gcode_macro PRINT_START]
description: Staged print start tuned for BDsensor collision homing without a brush.
gcode:
    {% set BED       = params.BED|default(60)|int %}
    {% set EXTRUDER  = params.EXTRUDER|default(210)|int %}
    {% set SOAK      = params.SOAK|default(0)|int %}
    {% set SOFT_TEMP = ${constants.soft_preheat_temp}|int %}
    {% set Z_OFFSET  = ${constants.thermal_z_offset}|float %}
    {% set WX_MIN    = ${constants.wipe_x_min}|float %}
    {% set WY        = ${constants.wipe_y}|float %}
    {% set WTZ       = ${constants.wipe_travel_z}|float %}

    # ---------- Phase 1: INIT ----------
    CLEAR_PAUSE
    M220 S100
    M221 S100
    G90
    M83
    SET_GCODE_OFFSET Z=0

    # ---------- Phase 2: Soft preheat ----------
    M104 S{SOFT_TEMP}                     ; hotend SOFT, no wait -- ramps in parallel
    HEATSOAK_BED S={BED} T={SOAK}         ; bed to target + optional soak (min)
    M109 S{SOFT_TEMP}                     ; wait for soft hotend temp

    # ---------- Phase 3: Home + Wipe + Level + Mesh ----------
    G32                                   ; mesh-clear, collision-safe home, wipe, tilt, mesh

    # ---------- Phase 4: Final heat over wipe zone ----------
    G1 Z{WTZ} F1500
    G1 X{WX_MIN} Y{WY} F9000              ; park over wipe zone -- drips land here
    M109 S{EXTRUDER}                      ; wait for full print temp
    SET_GCODE_OFFSET Z={Z_OFFSET} MOVE=1  ; nozzle thermal expansion compensation

    # ---------- Phase 5: Final wipe + adaptive prime ----------
    NOZZLE_WIPE_BED                       ; remove ooze from final heat ramp
    PRIME_LINE                            ; adaptive prime line from helpers/primeline.cfg


# PRINT_END mit Tip-Forming Retract und Exit-Purge.
# Der Exit-Purge deponiert verbleibendes Material in der Wipe-Zone und
# scrapet die Duese mechanisch, sodass der naechste PRINT_START mit
# einer mechanisch sauberen Duese startet.
[gcode_macro PRINT_END]
description: End-of-print with tip-forming retract and exit-purge cleanup.
gcode:
    {% set SAFE   = ${constants.safety_margin:15}|float %}
    {% set CX     = ${constants.center_x}|float %}
    {% set MAX_X  = printer.toolhead.axis_maximum.x|float %}
    {% set MAX_Y  = printer.toolhead.axis_maximum.y|float %}
    {% set WX_MIN = ${constants.wipe_x_min}|float %}
    {% set WX_MAX = ${constants.wipe_x_max}|float %}
    {% set WY     = ${constants.wipe_y}|float %}
    {% set WZ     = ${constants.wipe_z}|float %}
    {% set WTZ    = ${constants.wipe_travel_z}|float %}

    M400                                          ; finish all moves

    # ----- Heaters off -- nutze Cooldown-Fenster -----
    TURN_OFF_HEATERS

    # ----- Turn off CPAP and Side Blowers -----
    SET_FAN_SPEED FAN=Side_Blowers SPEED=0
    SET_FAN_SPEED FAN=CPAP SPEED=0

    G92 E0

    # ----- Tip-forming retract -----
    G91
    G1 E-2.0 F3600                                ; fast initial retract
    G1 E-4.0 F600                                 ; slow tail -- forms a clean tip
    G90

    # ----- Schneller Escape: minimal Z, dann rapid XY -- reisst Ooze-Faeden ab,
    # ohne den letzten Layer zu kratzen. Volles Z-Lift erst nach dem XY-Move.
    G91
    G1 Z0.2 F1500                                 ; clear last layer
    G90
    G1 X{MAX_X - SAFE} Y{MAX_Y - SAFE} F15000     ; rapid -- snaps strings
    G1 Z{WTZ} F1500

    # ----- Exit-Purge: only while extruder still hot enough to extrude -----
    {% if printer.extruder.temperature > 170 %}
        G1 X{WX_MIN} Y{WY} F12000                 ; back to wipe strip
        G1 Z{WZ} F600
        G1 X{WX_MAX} E0.8 F600                    ; tiny ooze deposit
        G1 E-2 F1800                              ; retract
        G1 X{WX_MIN} F12000                       ; drag back -- scrape
        G1 X{WX_MAX} F12000                       ; drag forward -- scrape
        G1 Z{WTZ} F600
    {% endif %}

    BED_MESH_CLEAR

    # ----- Park: hinten-Mitte (CoreXY, no negative coords) -----
    G1 X{CX} Y{MAX_Y - SAFE} F9000

    M84                                           ; disable steppers
    SET_GCODE_OFFSET Z=0
    M220 S100
    M221 S100


# CANCEL_PRINT: gleiche Cleanup-Pipeline wie PRINT_END, plus SD-Reset.
# Tolerant gegenueber Cancel vor Homing (z. B. waehrend Phase 2 Soft-Preheat).
[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
description: Cancel the print -- clean tip, park, end in same state as PRINT_END.
gcode:
    CLEAR_PAUSE

    {% if "xyz" in printer.toolhead.homed_axes %}
        # Voller Cleanup: tip-form retract, escape, exit-purge, park.
        PRINT_END
    {% else %}
        # Ohne Homing keine sicheren XY-Moves -- minimaler State-Reset.
        TURN_OFF_HEATERS
        SET_FAN_SPEED FAN=Side_Blowers SPEED=0
        SET_FAN_SPEED FAN=CPAP SPEED=0
        M220 S100
        M221 S100
        SET_GCODE_OFFSET Z=0
        M84
    {% endif %}

    SDCARD_RESET_FILE
    BASE_CANCEL_PRINT
