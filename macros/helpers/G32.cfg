[gcode_macro G32]
description: Home + brushless tip-clean + tilt + adaptive bed mesh.
    Tolerates a dirty nozzle on the first Z home. Wipes the tip before the accurate
    touch-based probes for tilt and mesh.
gcode:
    BED_MESH_CLEAR

    BDSENSOR_SET COLLISION_HOMING=0       ; non-contact home -- tolerates dirty tip
    CG28                                  ; home XYZ if not yet homed
    BDSENSOR_SET COLLISION_HOMING=1       ; back to collision-based for accurate probing

    TILT_CALIBRATE                        ; T250: Z_TILT_ADJUST (3 motors); T100: G28 Z0 fallback

    BED_MESH_CALIBRATE ADAPTIVE=1 ADAPTIVE_MARGIN=5