[gcode_macro PRIME_LINE]
description: Adaptive prime line scaled to bed size, safety margin, and the active extruder's nozzle/filament diameter. Bed and extruder values come straight from the Klipper runtime (printer.toolhead and printer.configfile.settings.extruder), so the macro works on stock Klipper too -- only the optional safety_margin reads the fork's [constants] pipeline (default 15mm).
gcode:
    {% set MARGIN = ${constants.safety_margin:15}|float %}
    {% set BED_X = printer.toolhead.axis_maximum.x|float %}
    {% set BED_Y = printer.toolhead.axis_maximum.y|float %}
    {% set NOZZLE = printer.configfile.settings.extruder.nozzle_diameter|float %}
    {% set FILAMENT = printer.configfile.settings.extruder.filament_diameter|float %}

    {% set LINE_WIDTH   = NOZZLE * 1.2 %}
    {% set LAYER_HEIGHT = NOZZLE * 0.6 %}
    {% set X_START = MARGIN %}
    {% set X_END   = BED_X - MARGIN %}
    {% set Y_LINE_1 = MARGIN %}
    {% set Y_LINE_2 = MARGIN + LINE_WIDTH * 0.75 %}
    {% set LINE_LEN = X_END - X_START %}
    {% set FIL_AREA = 3.141592653589793 * (FILAMENT / 2.0) * (FILAMENT / 2.0) %}
    {% set E_LINE = LINE_WIDTH * LAYER_HEIGHT * LINE_LEN / FIL_AREA %}

    M117 Prime Line...

    G90
    M83

    G0 X{ "%.3f" | format(X_START) } Y{ "%.3f" | format(Y_LINE_1) } F12000
    G1 Z{ "%.3f" | format(LAYER_HEIGHT) } F450

    G92 E0
    G1 E5 F300

    G92 E0
    G1 X{ "%.3f" | format(X_END) } Y{ "%.3f" | format(Y_LINE_1) } Z{ "%.3f" | format(LAYER_HEIGHT) } F1500 E{ "%.3f" | format(E_LINE) }
    G1 X{ "%.3f" | format(X_END) } Y{ "%.3f" | format(Y_LINE_2) } Z{ "%.3f" | format(LAYER_HEIGHT) } F12000
    G92 E0
    G1 X{ "%.3f" | format(X_START) } Y{ "%.3f" | format(Y_LINE_2) } Z{ "%.3f" | format(LAYER_HEIGHT) } F1500 E{ "%.3f" | format(E_LINE) }

    G92 E0
    G1 E-0.2 F2100
    G92 E0
    G1 Z3 F3000

    G91
    G1 X2 Y2 F12000
    G90

    M400
