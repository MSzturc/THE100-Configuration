[gcode_macro NOZZLE_WIPE_BED]
description: Drag the (150 C, solid-filament) nozzle across the wipe strip
    to scrape residue. Replaces hardware brush.
    Geometry comes from [constants] in print.cfg. Optional override: WIPES=<n>.
gcode:
    {% set WX_MIN = ${constants.wipe_x_min}|float %}
    {% set WX_MAX = ${constants.wipe_x_max}|float %}
    {% set WY     = ${constants.wipe_y}|float %}
    {% set WZ     = ${constants.wipe_z}|float %}
    {% set WSP    = ${constants.wipe_speed}|float %}
    {% set WTZ    = ${constants.wipe_travel_z}|float %}
    {% set WCNT   = params.WIPES|default(${constants.wipe_count})|int %}

    {% if "xyz" not in printer.toolhead.homed_axes %}
        RESPOND TYPE=error MSG="NOZZLE_WIPE_BED requires homed axes -- skipping."
    {% else %}
        SAVE_GCODE_STATE NAME=NOZZLE_WIPE_BED
        G90
        G1 Z{WTZ} F1500
        G1 X{WX_MIN} Y{WY} F9000
        G1 Z{WZ} F600
        {% for i in range(WCNT) %}
            G1 X{WX_MAX} F{WSP}
            G1 X{WX_MIN} F{WSP}
        {% endfor %}
        G1 Z{WTZ} F1500
        RESTORE_GCODE_STATE NAME=NOZZLE_WIPE_BED
    {% endif %}
