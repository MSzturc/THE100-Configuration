[constants]
center_x: round(${constants.print_volume_x} / 2)
center_y: round(${constants.print_volume_y} / 2)

[stepper_x]
position_min: 0
position_endstop: 0
position_max: ${constants.print_volume_x}

[stepper_y]
position_min: 0
position_endstop: 0
position_max: ${constants.print_volume_y}

[stepper_z]
position_min:-20
position_max: ${constants.print_volume_z}

[safe_z_home]
home_xy_position: ${constants.center_x}, ${constants.center_y}
speed: ${constants.homing_travelspeed_xy}
z_hop: 3
z_hop_speed: 50