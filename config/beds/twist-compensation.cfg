[constants]
twist_compensation_margin: ${constants.safety_margin:15}

twist_compensation_min_x: max(${constants.twist_compensation_margin} + ${constants.probe_offset_x:0}, ${constants.twist_compensation_margin})
twist_compensation_max_x: min(${constants.print_volume_x} - ${constants.twist_compensation_margin} + ${constants.probe_offset_x:0}, ${constants.print_volume_x} - ${constants.twist_compensation_margin})

twist_compensation_min_y: max(${constants.twist_compensation_margin} + ${constants.probe_offset_y:0}, ${constants.twist_compensation_margin})
twist_compensation_max_y: min(${constants.print_volume_y} - ${constants.twist_compensation_margin} + ${constants.probe_offset_y:0}, ${constants.print_volume_y} - ${constants.twist_compensation_margin})

[axis_twist_compensation]
speed: ${constants.homing_travelspeed_xy}
calibrate_start_x: ${constants.twist_compensation_min_x}
calibrate_end_x: ${constants.twist_compensation_max_x}
calibrate_y: ${constants.center_y}
calibrate_start_y: ${constants.twist_compensation_min_y}
calibrate_end_y: ${constants.twist_compensation_max_y}
calibrate_x: ${constants.center_x}
