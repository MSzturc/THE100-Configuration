[constants]
z_tilt_margin: ${constants.safety_margin:15}

z_tilt_min_x: max(${constants.z_tilt_margin}, ${constants.z_tilt_margin} - ${constants.probe_offset_x:0})
z_tilt_max_x: min(${constants.print_volume_x} - ${constants.z_tilt_margin}, ${constants.print_volume_x} - ${constants.z_tilt_margin} - ${constants.probe_offset_x:0})

z_tilt_min_y: max(${constants.z_tilt_margin}, ${constants.z_tilt_margin} - ${constants.probe_offset_y:0})
z_tilt_max_y: min(${constants.print_volume_y} - ${constants.z_tilt_margin}, ${constants.print_volume_y} - ${constants.z_tilt_margin} - ${constants.probe_offset_y:0})

[z_tilt]
z_positions:
    -44, -14
    232, -14
    94, 279
points:
    ${constants.z_tilt_min_x}, ${constants.z_tilt_min_y}
    ${constants.z_tilt_max_x}, ${constants.z_tilt_min_y}
    ${constants.center_x}, ${constants.z_tilt_max_y}
speed: ${constants.homing_travelspeed_xy}
horizontal_move_z: 1
retries: 5
retry_tolerance: 0.01
